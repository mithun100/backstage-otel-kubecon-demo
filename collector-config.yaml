# OpenTelemetry Collector config for the docker-compose demo path.
#
# Receives OTLP from the Backstage backend (grpc 4317 + http 4318), then
# fans traces out to Jaeger and metrics out to Prometheus (pull-based, via
# the `prometheus` exporter's own :8889/metrics endpoint).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Jaeger has supported OTLP ingestion natively since 1.35+, so we just
  # forward the already-OTLP traces to Jaeger's own OTLP gRPC receiver.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Prometheus scrapes this collector on :8889/metrics (see prometheus.yml).
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
