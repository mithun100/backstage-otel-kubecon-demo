name: otel-demo

services:
  backend:
    build:
      context: ./app
      dockerfile: packages/backend/Dockerfile
    image: backstage-otel-demo:latest
    container_name: backstage-backend
    ports:
      - '7007:7007'
    environment:
      # Container-to-container DNS name, not localhost — see instrumentation.ts.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Forwarded from the host shell so demo.sh can flip tracing on/off
      # (see NodeSDK's own OTEL_SDK_DISABLED support). Compose only passes
      # through host env vars that are explicitly referenced here.
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    depends_on:
      - otel-collector
      - toxiproxy
    networks:
      - otel-demo

  # A real, self-hosted git server (not a mock) — the scaffolder template
  # fetches a real file from a real repo hosted here, through toxiproxy below.
  # Admin user + repo are created by scripts/seed-gitea.sh (this image doesn't
  # auto-create an admin from env vars despite some docs suggesting otherwise).
  gitea:
    image: gitea/gitea:1.22
    container_name: gitea
    environment:
      USER_UID: '1000'
      USER_GID: '1000'
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: gitea
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__security__INSTALL_LOCK: 'true'
    ports:
      - '3002:3000' # host 3002 avoids clashing with Backstage's 3000 convention
    networks:
      - otel-demo

  # Shopify's Toxiproxy: a real fault-injection proxy, the same kind used for
  # chaos engineering. Sits in front of Gitea; demo.sh injects real network
  # latency (or takes the connection down entirely) through its admin API to
  # simulate "your git provider is having a bad day" — on command, reliably.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    container_name: toxiproxy
    ports:
      - '8474:8474' # Toxiproxy admin API
      - '8080:8080' # proxied path to Gitea (see scripts/seed-gitea.sh)
    depends_on:
      - gitea
    networks:
      - otel-demo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: otel-collector
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    networks:
      - otel-demo

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # Jaeger UI
    networks:
      - otel-demo

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    networks:
      - otel-demo

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3001:3000' # host 3001 avoids clashing with Backstage's own 3000 convention
    depends_on:
      - prometheus
    networks:
      - otel-demo

networks:
  otel-demo:
    driver: bridge
