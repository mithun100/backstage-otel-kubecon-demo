name: otel-demo

services:
  backend:
    build:
      context: ./app
      dockerfile: packages/backend/Dockerfile
    image: backstage-otel-demo:latest
    container_name: backstage-backend
    ports:
      - '7007:7007'
    environment:
      # Container-to-container DNS name, not localhost — see instrumentation.ts.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Forwarded from the host shell so demo.sh can flip tracing on/off
      # (see NodeSDK's own OTEL_SDK_DISABLED support). Compose only passes
      # through host env vars that are explicitly referenced here.
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    depends_on:
      - otel-collector
    networks:
      - otel-demo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: otel-collector
    command: ['--config=/etc/otel-collector-config.yaml']
    volumes:
      - ./collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - '4317:4317' # OTLP gRPC
      - '4318:4318' # OTLP HTTP
    networks:
      - otel-demo

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # Jaeger UI
    networks:
      - otel-demo

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    networks:
      - otel-demo

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3001:3000' # host 3001 avoids clashing with Backstage's own 3000 convention
    depends_on:
      - prometheus
    networks:
      - otel-demo

networks:
  otel-demo:
    driver: bridge
