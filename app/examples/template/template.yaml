apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: example-nodejs-template
  title: Example Node.js Template
  description: >-
    An example template for the scaffolder that creates a simple Node.js service.
    Fetches a real file from a real self-hosted git server (Gitea) through
    Toxiproxy — used by demo.sh to produce a real, traced scaffolder task.
spec:
  owner: user:guest
  type: service

  # These parameters are used to generate the input form in the frontend, and are
  # used to gather input data for the execution of the template.
  parameters:
    - title: Fill in some steps
      required:
        - name
      properties:
        name:
          title: Name
          type: string
          description: Unique name of the component
          ui:autofocus: true
          ui:options:
            rows: 5

  # These steps are executed in the scaffolder backend, using data that we gathered
  # via the parameters above.
  steps:
    # Each step executes an action, in this case one templates files into the working directory.
    - id: fetch-base
      name: Fetch Base
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}

    # Every real template calls out to SOMETHING external — here, a real git
    # server (Gitea), fetched through Toxiproxy. demo.sh injects real network
    # latency into Toxiproxy (or takes the connection down) to simulate "your
    # git provider is having a bad day" — a genuine outbound HTTP call, so
    # OTel's auto-instrumentation captures it as a real span with real duration.
    - id: fetch-from-git-provider
      name: Fetch From Git Provider
      action: fetch:plain:file
      input:
        url: http://toxiproxy:8080/demo-admin/demo-service-template/raw/branch/main/README.md
        targetPath: ./git-provider-response.md

    # Registers the repo as a real Catalog component. Fixed target (not
    # per-task) since there's no publish step creating a new repo each run —
    # see README for why. Idempotent: re-registering the same location is a no-op.
    - id: register
      name: Register In Catalog
      action: catalog:register
      input:
        catalogInfoUrl: http://toxiproxy:8080/demo-admin/demo-service-template/raw/branch/main/catalog-info.yaml
        optional: true

    # Let's notify the user that the template has completed using the Notification action
    - id: notify
      name: Notify
      action: notification:send
      input:
        recipients: entity
        entityRefs:
          - user:default/guest
        title: 'Template executed'
        info: 'Your template has been executed'
        severity: 'normal'


  # Outputs are displayed to the user after a successful execution of the template.
  output:
    links:
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps['register'].output.entityRef }}
